<title>Market Day Reel</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link
	rel="stylesheet"
	href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@500;600;700&family=Roboto:wght@400;500;700&display=swap"
/>
<style>
	/* Layout: a fixed 1920×1080 stage scaled to fit; guest phones, the room display, and the queue
   desk are simplified recreations of the app's real screens, all driven by one shared state. */
	:root {
		--font-body: Roboto, Arial, sans-serif;
		--font-heading: 'Roboto Condensed', 'Arial Narrow', Impact, sans-serif;
		--color-brand: #023940;
		--color-brand-dark: #012a2f;
		--color-on-brand: #fff;
		--color-background: #fff;
		--color-surface-soft: #f1f5f3;
		--color-text: #101010;
		--color-text-muted: #3d453f;
		--color-text-subtle: #60746a;
		--color-border: #5c655f;
		--color-focus: #ffb545;
		--color-success: #146c34;
		--color-error: #a12622;
		--radius-sm: 8px;
		--radius-md: 16px;
		--radius-lg: 24px;
		--reel-night: #011d21;
		--reel-ink: #e9f1ee;
		--reel-ink-soft: rgb(233 241 238 / 72%);
		color-scheme: dark;
	}
	* {
		box-sizing: border-box;
	}
	html,
	body {
		height: 100%;
	}
	body {
		margin: 0;
		background: var(--reel-night);
		color: var(--reel-ink);
		font-family: var(--font-body);
		display: flex;
		flex-direction: column;
		align-items: center;
		justify-content: center;
		gap: 14px;
		padding-inline: 16px;
		padding-block: 16px;
		overflow: hidden;
	}
	#viewport {
		position: relative;
		width: min(100%, calc((100dvh - 96px) * 16 / 9));
		aspect-ratio: 16 / 9;
		max-width: 100%;
		overflow: hidden;
		border-radius: 14px;
		box-shadow: 0 30px 80px rgb(0 0 0 / 45%);
	}
	body.record {
		padding: 0;
		gap: 0;
	}
	body.record #viewport {
		width: 100vw;
		height: 100vh;
		aspect-ratio: auto;
		border-radius: 0;
		box-shadow: none;
	}
	body.record #controls {
		display: none;
	}

	#stage {
		position: absolute;
		left: 0;
		top: 0;
		width: 1920px;
		height: 1080px;
		transform-origin: 0 0;
		overflow: hidden;
		background:
			radial-gradient(circle at 72% 28%, rgb(3 74 82 / 85%) 0, transparent 52%),
			radial-gradient(circle at 12% 90%, rgb(2 57 64 / 70%) 0, transparent 45%),
			linear-gradient(160deg, var(--color-brand-dark), var(--reel-night));
		font-family: var(--font-body);
	}
	#stage::after {
		content: '';
		position: absolute;
		inset: 0;
		pointer-events: none;
		background-image: radial-gradient(rgb(255 255 255 / 5%) 1px, transparent 1.4px);
		background-size: 28px 28px;
		mask-image: linear-gradient(180deg, transparent, #000 40%, #000 70%, transparent);
	}

	/* ---------- controls ---------- */
	#controls {
		display: flex;
		align-items: center;
		gap: 12px;
		width: min(100%, calc((100dvh - 96px) * 16 / 9));
		font-family: var(--font-heading);
		font-size: 15px;
		letter-spacing: 0.04em;
	}
	#controls button {
		min-width: 44px;
		height: 40px;
		padding: 0 14px;
		border: 1.5px solid rgb(233 241 238 / 35%);
		border-radius: 999px;
		color: var(--reel-ink);
		background: transparent;
		font: inherit;
		font-weight: 700;
		text-transform: uppercase;
		cursor: pointer;
	}
	#controls button:hover {
		border-color: var(--color-focus);
	}
	#controls button:focus-visible,
	#scrub:focus-visible {
		outline: 3px solid var(--color-focus);
		outline-offset: 2px;
	}
	#scrub {
		flex: 1;
		min-width: 0;
		accent-color: var(--color-focus);
	}
	#clock {
		min-width: 5ch;
		font-variant-numeric: tabular-nums;
		color: var(--reel-ink-soft);
		text-align: end;
	}

	/* ---------- captions ---------- */
	#cap {
		position: absolute;
		left: 70px;
		top: 34px;
		width: 1380px;
		z-index: 30;
		transition:
			left 0.9s cubic-bezier(0.65, 0, 0.35, 1),
			top 0.9s cubic-bezier(0.65, 0, 0.35, 1),
			width 0.9s;
	}
	#stage[data-phase='solo'] #cap {
		left: 150px;
		top: 330px;
		width: 860px;
	}
	#stage[data-phase='grid'] #cap {
		left: 203px;
		top: 56px;
	}
	#cap .inner {
		animation: capIn 0.7s cubic-bezier(0.2, 0.8, 0.2, 1) both;
	}
	#cap .eyebrow {
		font-family: var(--font-heading);
		font-size: 19px;
		font-weight: 700;
		letter-spacing: 0.16em;
		text-transform: uppercase;
		color: var(--color-focus);
	}
	#cap .head {
		margin-top: 6px;
		font-family: var(--font-heading);
		font-size: 46px;
		font-weight: 700;
		line-height: 1.05;
		letter-spacing: -0.005em;
		color: #fff;
		text-wrap: balance;
	}
	#cap .sub {
		margin-top: 8px;
		font-size: 21px;
		line-height: 1.4;
		color: var(--reel-ink-soft);
	}
	#stage[data-phase='solo'] #cap .head {
		font-size: 68px;
	}
	#stage[data-phase='solo'] #cap .sub {
		margin-top: 18px;
		font-size: 27px;
		max-width: 40ch;
	}
	@keyframes capIn {
		from {
			opacity: 0;
			transform: translateY(18px);
			filter: blur(4px);
		}
	}

	/* ---------- title + outro ---------- */
	.card-center {
		position: absolute;
		inset: 0;
		display: flex;
		flex-direction: column;
		align-items: center;
		justify-content: center;
		gap: 28px;
		text-align: center;
		z-index: 40;
		pointer-events: none;
	}
	.wordmark {
		width: 640px;
		filter: brightness(0) invert(1);
	}
	.card-center .line {
		font-family: var(--font-heading);
		font-size: 44px;
		font-weight: 600;
		color: #fff;
		letter-spacing: 0.01em;
	}
	.card-center .tags {
		display: flex;
		gap: 14px;
	}
	.card-center .tags span {
		padding: 10px 22px;
		border: 2px solid rgb(255 255 255 / 40%);
		border-radius: 999px;
		font-family: var(--font-heading);
		font-size: 22px;
		font-weight: 700;
		letter-spacing: 0.06em;
		text-transform: uppercase;
		color: var(--reel-ink);
	}
	.card-center .tags span:first-child {
		border-color: var(--color-focus);
		color: var(--color-focus);
	}

	/* ---------- phones ---------- */
	.phone {
		position: absolute;
		left: 0;
		top: 0;
		width: 380px;
		height: 780px;
		padding: 12px;
		border-radius: 56px;
		background: linear-gradient(145deg, #2a3436, #0b1112 40%, #1b2426);
		box-shadow:
			0 0 0 2px rgb(255 255 255 / 8%) inset,
			0 40px 70px rgb(0 0 0 / 45%);
		opacity: 0;
		will-change: transform, opacity;
	}
	.phone::before {
		content: '';
		position: absolute;
		top: 22px;
		left: 50%;
		width: 96px;
		height: 26px;
		margin-left: -48px;
		border-radius: 20px;
		background: #05090a;
		z-index: 5;
	}
	.phone.is-called {
		animation: calledGlow 1.3s ease-in-out 3;
	}
	@keyframes calledGlow {
		0%,
		100% {
			box-shadow:
				0 0 0 2px rgb(255 255 255 / 8%) inset,
				0 40px 70px rgb(0 0 0 / 45%);
		}
		50% {
			box-shadow:
				0 0 0 2px rgb(255 255 255 / 8%) inset,
				0 0 0 10px rgb(255 181 69 / 70%),
				0 0 90px 30px rgb(255 181 69 / 40%);
		}
	}
	.screen {
		position: relative;
		width: 356px;
		height: 756px;
		overflow: hidden;
		border-radius: 44px;
		background: var(--color-background);
		color: var(--color-text);
		font-family: var(--font-body);
	}
	.statusbar {
		display: flex;
		justify-content: space-between;
		align-items: center;
		height: 52px;
		padding: 14px 30px 0;
		font-size: 15px;
		font-weight: 700;
		color: #fff;
		background: var(--color-brand);
	}
	.statusbar.light {
		color: var(--color-text);
		background: var(--color-background);
	}
	.statusbar i {
		display: inline-flex;
		gap: 5px;
		align-items: center;
		font-style: normal;
	}
	.statusbar i b {
		display: inline-block;
		width: 22px;
		height: 11px;
		border: 1.5px solid currentColor;
		border-radius: 3px;
		position: relative;
	}
	.statusbar i b::after {
		content: '';
		position: absolute;
		inset: 1.5px 5px 1.5px 1.5px;
		background: currentColor;
		border-radius: 1px;
	}
	.statusbar i s {
		display: inline-block;
		width: 15px;
		height: 10px;
		text-decoration: none;
		background: linear-gradient(
			90deg,
			currentColor 3px,
			transparent 3px 4px,
			currentColor 4px 7px,
			transparent 7px 8px,
			currentColor 8px 11px,
			transparent 11px 12px,
			currentColor 12px
		);
		clip-path: polygon(0 100%, 100% 0, 100% 100%);
	}
	.app {
		height: 704px;
		overflow: hidden;
	}
	.app.swap {
		animation: swapIn 0.5s cubic-bezier(0.2, 0.8, 0.2, 1);
	}
	@keyframes swapIn {
		from {
			opacity: 0.2;
			transform: translateY(14px);
		}
	}

	.topbar {
		display: flex;
		align-items: center;
		justify-content: space-between;
		height: 60px;
		padding: 0 16px 0 20px;
		color: var(--color-on-brand);
		background: var(--color-brand);
	}
	.brand {
		display: inline-flex;
		align-items: center;
		gap: 8px;
		font-family: var(--font-heading);
		font-weight: 700;
		font-size: 14.5px;
		text-transform: uppercase;
		white-space: nowrap;
	}
	.brand img {
		width: 28px;
		height: 28px;
		border-radius: var(--radius-sm);
		background: #fff;
	}
	.topbar .acts {
		display: flex;
		gap: 6px;
	}
	.topbar .acts svg {
		width: 34px;
		height: 34px;
		padding: 6px;
	}

	.guest-layout {
		width: 320px;
		margin: 0 auto;
		padding: 22px 0 0;
	}
	.hero {
		margin-bottom: 20px;
		padding: 22px 20px;
		color: var(--color-on-brand);
		background: var(--color-brand);
		border-radius: var(--radius-lg);
	}
	.hero h1 {
		margin: 0 0 16px;
		font-family: var(--font-heading);
		font-size: 28px;
		font-weight: 700;
		line-height: 1.05;
		text-transform: uppercase;
		min-height: 88px;
	}
	.hero h1[dir='rtl'],
	.hero .language-prompt[dir='rtl'] {
		text-align: right;
		text-transform: none;
	}
	.language-selector {
		padding-top: 16px;
		border-top: 2px solid rgb(255 255 255 / 40%);
	}
	.language-prompt {
		margin: 0 0 10px;
		font-family: var(--font-heading);
		font-size: 14px;
		font-weight: 700;
		letter-spacing: 0.04em;
		text-transform: uppercase;
	}
	.language-list {
		display: flex;
		flex-wrap: wrap;
		gap: 8px;
	}
	.language-option {
		position: relative;
		display: inline-flex;
		align-items: center;
		min-height: 40px;
		padding: 0 14px;
		border: 2px solid var(--color-on-brand);
		border-radius: 999px;
		color: var(--color-on-brand);
		font-size: 15px;
		font-weight: 700;
		transition:
			background 0.2s,
			color 0.2s;
	}
	.language-option.active {
		color: var(--color-brand);
		background: var(--color-on-brand);
	}

	.fieldset {
		display: grid;
		gap: 18px;
	}
	.legend {
		font-family: var(--font-heading);
		font-size: 20px;
		font-weight: 700;
		text-transform: uppercase;
	}
	.field {
		position: relative;
		height: 56px;
		padding: 0 14px;
		display: flex;
		align-items: center;
		border: 1px solid rgb(0 0 0 / 30%);
		border-radius: 4px;
		font-size: 16px;
	}
	.field label {
		position: absolute;
		left: 10px;
		top: -9px;
		padding: 0 4px;
		font-size: 12.5px;
		color: var(--color-text-subtle);
		background: var(--color-background);
	}
	.field.focus {
		border: 2px solid var(--color-brand);
		padding: 0 13px;
	}
	.field.focus label {
		color: var(--color-brand);
	}
	.field.focus span::after {
		content: '';
		display: inline-block;
		width: 1.5px;
		height: 19px;
		margin-left: 1px;
		vertical-align: -3px;
		background: var(--color-brand);
		animation: caret 1s steps(1) infinite;
	}
	@keyframes caret {
		50% {
			opacity: 0;
		}
	}
	.submit {
		position: relative;
		display: flex;
		align-items: center;
		justify-content: center;
		height: 52px;
		margin-top: 4px;
		border-radius: 6px;
		color: #fff;
		background: var(--color-brand);
		font-size: 15px;
		font-weight: 700;
		letter-spacing: 0.04em;
		text-transform: uppercase;
		box-shadow: 0 3px 8px rgb(2 57 64 / 30%);
	}

	/* status panel */
	.panel {
		display: grid;
		grid-template-columns: minmax(0, 1fr);
		text-align: center;
		padding-top: 4px;
	}
	.panel .mark {
		display: grid;
		width: 58px;
		height: 58px;
		place-self: center;
		place-items: center;
		margin-bottom: 17px;
		border-radius: var(--radius-md);
		color: var(--color-on-brand);
		background: var(--color-brand);
		font-size: 29px;
	}
	.panel .mark.action {
		background: var(--color-success);
		font-size: 34px;
	}
	.panel h2 {
		margin: 0 0 9px;
		font-family: var(--font-heading);
		font-size: 29px;
		font-weight: 700;
		line-height: 1.05;
		letter-spacing: -0.01em;
		text-transform: uppercase;
	}
	.panel p {
		max-width: 280px;
		margin: 0 auto 22px;
		color: var(--color-text-muted);
		font-size: 16px;
		line-height: 1.5;
	}
	[dir='rtl'] .panel h2,
	[lang='zh'] .panel h2 {
		text-transform: none;
	}
	.stamp {
		display: grid;
		grid-template-columns: auto auto;
		align-items: center;
		justify-content: center;
		column-gap: 14px;
		margin: 0 auto 18px;
		padding: 10px 20px;
		border: 2px dashed rgb(92 101 95 / 60%);
		border-radius: var(--radius-md);
		font-family: var(--font-heading);
		font-weight: 700;
		line-height: 1.15;
		text-align: start;
	}
	.stamp .live {
		position: relative;
		width: 12px;
		height: 12px;
		border-radius: 50%;
		background: var(--color-success);
	}
	.stamp .live::after {
		content: '';
		position: absolute;
		inset: 0;
		border-radius: 50%;
		background: var(--color-success);
		animation: ripple 1.6s ease-out infinite;
	}
	@keyframes ripple {
		0% {
			transform: scale(1);
			opacity: 0.45;
		}
		70%,
		100% {
			transform: scale(2.4);
			opacity: 0;
		}
	}
	.stamp strong {
		display: block;
		font-size: 26px;
	}
	.stamp small {
		display: block;
		font-size: 16px;
		color: var(--color-text-subtle);
	}
	.standing {
		display: flex;
		flex-direction: column;
		border-radius: var(--radius-md);
		overflow: hidden;
		background: var(--color-surface-soft);
	}
	.board {
		--warmth: 0;
		display: flex;
		flex-direction: column;
		align-items: center;
		gap: 6px;
		padding: 18px 20px 20px;
		color: var(--color-on-brand);
		background: color-mix(in oklch, var(--tone), var(--color-focus) calc(var(--warmth) * 100%));
		transition:
			background-color 1.4s linear,
			color 0.4s;
	}
	.board.dark-text {
		color: var(--color-text);
	}
	.board > span {
		display: flex;
		align-items: center;
		gap: 4px;
		font-size: 13px;
		font-weight: 600;
		letter-spacing: 0.03em;
		text-transform: uppercase;
	}
	.board svg {
		width: 14px;
		height: 14px;
	}
	.board strong {
		font-family: var(--font-heading);
		font-weight: 700;
		font-size: 84px;
		line-height: 1;
		font-variant-numeric: tabular-nums;
	}
	.nowcalling {
		display: flex;
		flex-direction: column;
		align-items: center;
		gap: 10px;
		padding: 14px 20px 16px;
	}
	.nowcalling > span {
		font-size: 13px;
		font-weight: 600;
		letter-spacing: 0.03em;
		text-transform: uppercase;
		color: var(--color-text-muted);
	}
	.panel .mark.muted {
		background: var(--color-text-subtle);
	}
	.countdown {
		display: grid;
		gap: 2px;
		padding: 14px 18px;
		border-radius: var(--radius-md);
		color: var(--color-on-brand);
		background: color-mix(
			in oklch longer hue,
			var(--color-brand),
			var(--color-error) calc(var(--progress) * 100%)
		);
		text-align: center;
	}
	.countdown span {
		font-size: 12px;
		font-weight: 700;
		letter-spacing: 0.06em;
		text-transform: uppercase;
		opacity: 0.85;
	}
	[dir='rtl'] .countdown span,
	[lang='zh'] .countdown span {
		text-transform: none;
		letter-spacing: normal;
	}
	.countdown strong {
		font-family: var(--font-heading);
		font-size: 38px;
		font-weight: 700;
		font-variant-numeric: tabular-nums;
		letter-spacing: 0.02em;
	}
	.nowcalling .none {
		font-size: 15px;
		font-weight: 500;
		color: var(--color-text-muted);
	}
	.tiles {
		display: flex;
		gap: 8px;
		justify-content: center;
		align-items: center;
		font-family: var(--font-heading);
		font-weight: 700;
		line-height: 1;
	}
	.tile {
		display: inline-flex;
		align-items: center;
		justify-content: center;
		min-width: 52px;
		padding: 7px 12px;
		border-radius: 12px;
	}
	.tile.latest {
		background: var(--color-brand);
		color: var(--color-on-brand);
		font-size: 30px;
	}
	.tile.earlier {
		border: 2px solid var(--color-brand);
		color: var(--color-brand);
		font-size: 22px;
		padding: 5px 10px;
		min-width: 44px;
	}

	/* ---------- queue desk ---------- */
	#desk {
		opacity: 0;
	}
	#desk .screen {
		background: var(--color-background);
	}
	.desk-body {
		display: grid;
		gap: 12px;
		padding: 8px 12px 0;
		height: 704px;
		overflow: hidden;
		align-content: start;
	}
	.dh {
		display: flex;
		justify-content: space-between;
		align-items: center;
		padding: 4px 4px 0 6px;
	}
	.dh h1 {
		margin: 0;
		font-family: var(--font-heading);
		font-size: 24px;
		font-weight: 700;
	}
	.dh .status {
		display: flex;
		align-items: center;
		gap: 6px;
		margin: 0;
		color: var(--color-success);
		font-size: 13px;
		font-weight: 700;
	}
	.dh .status::before {
		content: '';
		width: 7px;
		height: 7px;
		border-radius: 50%;
		background: currentColor;
	}
	.dh .kebab {
		font-size: 24px;
		color: var(--color-text-muted);
	}
	.tsection {
		padding: 12px 10px 8px;
		border-radius: var(--radius-lg);
		background: var(--color-surface-soft);
	}
	.tsection header {
		display: flex;
		justify-content: space-between;
		align-items: center;
		min-height: 32px;
		padding: 0 8px 4px;
	}
	.tsection h2 {
		display: flex;
		align-items: center;
		gap: 8px;

		at(29.2 + SHIFT, (s) => {

		at(29.65 + SHIFT, (s) => {

		at(30.5 + SHIFT, (s) => {

				'Late arrivals',

				'It moves to Already Called on the board.',

		at(31.6 + SHIFT, (s) => {
			s.sheet = null;
		});
		at(32.1 + SHIFT, (s) => {

		at(32.55 + SHIFT, (s) => {

		at(34.4 + SHIFT, (s) => {

			'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12.9 15.1 10.4 12.6l.03-.03A17.5 17.5 0 0 0 14.1 6H17V4h-7V2H8v2H1v2h11.2A15.8 15.8 0 0 1 9 11.4 15.6 15.6 0 0 1 6.7 8H4.7c.73 1.63 1.73 3.17 2.98 4.56l-5.09 5.02L4 19l5-5 3.11 3.11.76-2.02ZM18.5 10h-2L12 22h2l1.12-3h4.75L21 22h2l-4.5-12Zm-2.62 7 1.62-4.33L19.12 17h-3.24Z"/></svg>';

		function statusHtml(s, x) {
			const L = S[x.loc];
			let mark = '✓',
				tone = '',
				head = L.waiting,
				det = L.waitingDetails,
				board = true;

		function renderPhones(s) {

					el.classList.remove('is-called');
					void el.offsetWidth;
					el.classList.add('is-called');
				}
				if (x.status !== 'called') el.classList.remove('is-called');
				el.dataset.status = x.status;
			});
		}

		/* desk */
		const deskEl = document.getElementById('desk');
		const deskBody = document.getElementById('deskBody');
		const sheetEl = document.getElementById('sheet');
		const callNextEl = document.getElementById('callNext');

		function chip(s, x) {
			return (
				'<li class="chip' +
				(s.tap === 'chip-' + x.n ? ' tapping' : '') +
				'" data-status="' +
				x.status +

		/* kiosk */
		const k = (id) => document.getElementById(id);

		let lastKioskNum = null;
		function renderKiosk(s, time) {
			const idx = Math.max(0, Math.floor((time - 19.4 - SHIFT) / 3.4)) % KIOSK_ROTATION.length;
			const loc = KIOSK_ROTATION[idx];

			const dir = RTL.has(loc) ? 'rtl' : 'auto';

			const second = (el, text) => {

			const numWrap = k('kNum');

		/* captions */
		const capEl = document.getElementById('cap');
		function renderCaption(s) {
			const c = s.cap;
			put(

		const stage = document.getElementById('stage');
		let lastIndex = -1;
		function renderAt(time) {
			let i = 0;

			if (i !== lastIndex) {
				lastIndex = i;

				renderPhones(s);
				renderDesk(s);

		/* ================= timeline ================= */

		const tl = gsap.timeline({
			id: 'Market Day Reel',
			paused: true,
			onUpdate: () => {
				renderAt(tl.time());
				syncControls();
				syncAudio();
				devTick?.();
			},
		});

		// Title card.
		tl.fromTo(
			'#title .wordmark',
			{ opacity: 0, y: 30, scale: 0.94 },
			{ opacity: 1, y: 0, scale: 1, duration: 1.1, ease: 'power3.out', immediateRender: false },
			0.2,
		);
		tl.fromTo(
			'#title .line',
			{ opacity: 0, y: 24 },
			{ opacity: 1, y: 0, duration: 0.9, ease: 'power3.out', immediateRender: false },
			0.9,
		);
		tl.to('#title', { opacity: 0, scale: 1.04, duration: 0.6, ease: 'power2.in' }, 3.3);

		// Phones follow their place in the state, beat by beat.
		phoneEls.forEach((el, i) => gsap.set(el, layoutOf(snaps[0].s, snaps[0].s.guests[i])));
		for (let b = 1; b < snaps.length; b++) {
			const prev = snaps[b - 1].s,
				cur = snaps[b].s;
			cur.guests.forEach((x, i) => {
				const a = layoutOf(prev, prev.guests[i]);
				const z = layoutOf(cur, x);
				if (a.x === z.x && a.y === z.y && a.scale === z.scale && a.opacity === z.opacity) return;
				const from = prev.guests[i].place,
					to = x.place;
				let duration = snaps[b].opts.dur ?? 0.85,
					ease = 'power3.inOut',
					delay = 0;
				if (from === 'hidden') {
					duration = 0.6;
					ease = 'back.out(1.9)';
					delay = to === 'grid' ? REG_ORDER.indexOf(x.n) * 0.055 : 0;
				} else if (to === 'gone') {
					duration = Math.min(duration, 0.8);
					ease = 'power2.in';
				} else if (to === 'dropped') {
					duration = 1.2;
					ease = 'power2.inOut';
				} else if (from === 'grid' && to === 'row') {
					duration = 1.1;
					delay = (29 - i) * 0.018;
				}
				if (cur.phase === 'outro') {
					duration = 0.8;
					delay = 0;
					ease = 'power2.inOut';
				}
				tl.fromTo(
					phoneEls[i],
					a,
					{ ...z, duration, ease, immediateRender: false },
					snaps[b].t + delay,
				);
			});
			if (prev.kiosk !== cur.kiosk) {
				tl.fromTo(
					'#kiosk',
					{ x: cur.kiosk ? -260 : 0, opacity: cur.kiosk ? 0 : 1 },
					{
						x: cur.kiosk ? 0 : -60,
						opacity: cur.kiosk ? 1 : 0,
						duration: 1.1,
						ease: 'power3.out',
						immediateRender: false,
					},
					snaps[b].t + (cur.kiosk ? 0.35 : 0),
				);
				tl.fromTo(
					'#zKiosk',
					{ opacity: cur.kiosk ? 0 : 1 },
					{ opacity: cur.kiosk ? 1 : 0, duration: 0.6, immediateRender: false },
					snaps[b].t + (cur.kiosk ? 1.2 : 0),
				);
			}
			if (prev.desk !== cur.desk) {
				gsap.set('#desk', { x: 1490, y: 140, scale: 0.98, transformOrigin: '0 0' });
				tl.fromTo(
					'#desk',
					{ x: cur.desk ? 1990 : 1490, opacity: cur.desk ? 0 : 1 },
					{
						x: cur.desk ? 1490 : 1560,
						opacity: cur.desk ? 1 : 0,
						duration: 1.1,
						ease: 'power3.out',
						immediateRender: false,
					},
					snaps[b].t + (cur.desk ? 0.55 : 0),
				);
				tl.fromTo(
					'#zDesk',
					{ opacity: cur.desk ? 0 : 1 },
					{ opacity: cur.desk ? 1 : 0, duration: 0.6, immediateRender: false },
					snaps[b].t + (cur.desk ? 1.4 : 0),
				);
			}
			if (!prev.outro && cur.outro) {
				tl.fromTo(
					'#outro',
					{ opacity: 0, scale: 0.96 },
					{ opacity: 1, scale: 1, duration: 1.2, ease: 'power3.out', immediateRender: false },
					snaps[b].t + 0.7,
				);
				tl.fromTo(
					'#outro .tags span',
					{ opacity: 0, y: 16 },
					{
						opacity: 1,
						y: 0,
						duration: 0.5,
						stagger: 0.18,
						ease: 'power2.out',
						immediateRender: false,
					},
					snaps[b].t + 1.6,
				);
			}
		}
		tl.set({}, {}, END);

		/* ================= soundtrack ================= */

		// Arranged from GarageBand's Apple Loops (the Moving Pictures kit, with Kyle on drums) to the
		// reel's sections, and embedded so the page needs no other file.
		const SOUNDTRACK = '__SOUNDTRACK__';
		async function renderSoundtrack() {
			const bytes = Uint8Array.from(atob(SOUNDTRACK), (c) => c.charCodeAt(0));
			return new OfflineAudioContext(2, 1, 44100).decodeAudioData(bytes.buffer);
		}

		let soundtrack = null;
		const soundtrackReady = renderSoundtrack()
			.then((buffer) => (soundtrack = buffer))
			.catch(() => {
				// A browser without AAC decoding plays the reel silently rather than offering dead sound.
				const button = document.getElementById('sound');
				button.disabled = true;
				button.textContent = 'No sound';
			});

		/* ================= controls ================= */

		const viewport = document.getElementById('viewport');
		const fit = () => {
			stage.style.transform = 'scale(' + viewport.clientWidth / 1920 + ')';
		};
		new ResizeObserver(fit).observe(viewport);
		fit();

		const playBtn = document.getElementById('play');
		const scrub = document.getElementById('scrub');
		const clock = document.getElementById('clock');
		const fmt = (sec) => Math.floor(sec / 60) + ':' + String(Math.floor(sec % 60)).padStart(2, '0');
		function syncControls() {
			scrub.value = String(Math.round((tl.time() / END) * 1000));
			clock.textContent = fmt(tl.time());
			const label = tl.paused() || tl.progress() === 1 ? 'Play' : 'Pause';
			playBtn.textContent = label;
			playBtn.setAttribute('aria-label', label);
		}
		/* Browsers start sound only from a click, so it begins off until the viewer turns it on. */
		const soundBtn = document.getElementById('sound');
		let audio = null;
		let source = null;
		let soundOn = false;
		let sourceStart = { ctx: 0, offset: 0 };
		function stopAudio() {
			if (!source) return;
			try {
				source.stop();
			} catch {}
			source.disconnect();
			source = null;
		}
		function startAudio() {
			stopAudio();
			if (!soundOn || !soundtrack || !audio || tl.paused() || tl.progress() === 1) return;
			source = audio.createBufferSource();
			source.buffer = soundtrack;
			source.connect(audio.destination);
			sourceStart = { ctx: audio.currentTime, offset: tl.time() };
			source.start(0, tl.time());
		}
		function syncAudio() {
			if (!soundOn) return;
			if (tl.paused() || tl.progress() === 1) return stopAudio();
			if (!source) return startAudio();
			const position = sourceStart.offset + audio.currentTime - sourceStart.ctx;
			if (Math.abs(position - tl.time()) > 0.15) startAudio();
		}
		async function setSound(on) {
			soundOn = on;
			soundBtn.textContent = on ? 'Sound on' : 'Sound off';
			soundBtn.setAttribute('aria-pressed', String(on));
			if (!on) return stopAudio();
			audio ??= new AudioContext();
			await audio.resume();
			await soundtrackReady;
			startAudio();
		}
		soundBtn.addEventListener('click', () => void setSound(!soundOn));

		tl.eventCallback('onComplete', () => {
			syncControls();
			stopAudio();
			if (!document.body.classList.contains('record')) gsap.delayedCall(3, () => tl.restart());
		});
		playBtn.addEventListener('click', () => {
			if (tl.progress() === 1) tl.restart();
			else tl.paused(!tl.paused());
			syncControls();
			if (tl.paused()) stopAudio();
			else startAudio();
		});
		document.getElementById('restart').addEventListener('click', () => {
			tl.restart();
			syncControls();
			startAudio();
		});
		scrub.addEventListener('input', () => {
			tl.pause();
			stopAudio();
			tl.time((Number(scrub.value) / 1000) * END);
			syncControls();
		});

		/* ================= dev mode (#dev) ================= */

		// GSAP's own scrubber along the bottom, and every beat of the script down the side: what it
		// changes, when, and the line in reel.src.html that schedules it. Click a beat to jump there.
		function describeBeat(prev, cur) {
			const items = [];
			let minor = null;
			const toggle = (key, on, off) => prev[key] !== cur[key] && items.push(cur[key] ? on : off);
			if (prev.phase !== cur.phase) items.push('Scene: ' + cur.phase);
			toggle('title', 'Title card in', 'Title card out');
			toggle('kiosk', 'Room display in', 'Room display out');
			toggle('desk', 'Queue desk in', 'Queue desk out');
			if (!prev.outro && cur.outro) items.push('Closing card');
			if (cur.cap && prev.cap?.head !== cur.cap.head) items.push('Caption: “' + cur.cap.head + '”');
			if (prev.nowCalling !== cur.nowCalling && cur.nowCalling !== null)
				items.push('Calls #' + cur.nowCalling);
			if (prev.tap !== cur.tap && cur.tap) items.push('Tap: ' + cur.tap);
			if (prev.sheet !== cur.sheet)
				items.push(cur.sheet === null ? 'Ticket closes' : 'Ticket #' + cur.sheet + ' opens');
			if (prev.heroLang !== cur.heroLang) items.push('Welcome card in ' + cur.heroLang);
			const statuses = [],
				places = [];
			cur.guests.forEach((x, i) => {
				const was = prev.guests[i];
				if (was.status !== x.status) statuses.push([x.n, was.status, x.status]);
				if (was.place !== x.place) places.push([x.n, x.place]);
				if (was.warmth !== x.warmth) items.push('#' + x.n + ' board warms to ' + x.warmth);
			});
			const group = (list, word) => {
				if (list.length > 3) {
					const counts = {};
					list.forEach(([, , to]) => (counts[to] = (counts[to] ?? 0) + 1));
					Object.entries(counts).forEach(([to, n]) => items.push(n + ' guests ' + word + ' ' + to));
				} else list.forEach(([n, , to]) => items.push('#' + n + ' ' + word + ' ' + to));
			};
			const onlyReveal =
				statuses.length === 1 && statuses[0][1] === 'registered' && !places.length && !items.length;
			if (onlyReveal) minor = 'Draw reveals';
			else group(statuses, '→');
			group(
				places.map(([n, to]) => [n, null, to]),
				'to',
			);
			if (!items.length && !minor) {
				if (prev.clock !== cur.clock) minor = 'Countdown ticks';
				else if (
					prev.focus !== cur.focus ||
					JSON.stringify(prev.typed) !== JSON.stringify(cur.typed)
				)
					minor = 'Typing';
			}
			return { items, minor };
		}

		function devRows() {
			const rows = [];
			for (let i = 1; i < snaps.length; i++) {
				const { items, minor } = describeBeat(snaps[i - 1].s, snaps[i].s);
				const beat = { t: snaps[i].t, line: snaps[i].opts.line };
				const last = rows[rows.length - 1];
				if (minor && last?.minor === minor) {
					last.count += 1;
					last.end = beat.t;
				} else if (minor) rows.push({ ...beat, minor, count: 1, end: beat.t, text: minor });
				else if (items.length) rows.push({ ...beat, text: items.join(' · ') });
			}
			return rows;
		}

		let devStarted = false;
		async function startDevMode() {
			if (devStarted) {
				return;
			}

			devStarted = true;
			tl.pause();
			stopAudio();
			document.body.classList.add('dev');
			const panel = document.createElement('aside');
			panel.id = 'beats';
			panel.innerHTML =
				'<header><h2>Beats</h2><span id="beatClock">0.00s</span><button type="button" id="devSound">Sound off</button></header>' +
				'<p>Click a beat to jump to it. <b>L</b> numbers are lines in <code>reel.src.html</code>.</p><ol></ol>';
			document.body.appendChild(panel);
			const list = panel.querySelector('ol');
			const rows = devRows();
			const buttons = rows.map((row) => {
				const li = document.createElement('li');
				const button = document.createElement('button');
				button.type = 'button';
				if (row.minor) button.className = 'minor';
				const span = row.count > 1 ? row.t.toFixed(2) + '–' + row.end.toFixed(2) : row.t.toFixed(2);
				button.innerHTML =
					'<time>' +
					span +
					'</time><span>' +
					esc(row.text) +
					(row.count > 1 ? ' ×' + row.count : '') +
					'</span>' +
					'<code>' +
					(row.line ? 'L' + row.line : '') +
					'</code>';
				button.addEventListener('click', () => {
					tl.pause();
					stopAudio();
					tl.time(row.t + 0.001);
				});
				li.appendChild(button);
				list.appendChild(li);
				return button;
			});
			const clockEl = panel.querySelector('#beatClock');
			let active = -1;
			devTick = () => {
				const time = tl.time();
				clockEl.textContent = time.toFixed(2) + 's';
				let i = -1;
				while (i + 1 < rows.length && rows[i + 1].t <= time) i++;
				if (i === active) return;
				buttons[active]?.removeAttribute('aria-current');
				active = i;
				if (buttons[i]) {
					buttons[i].setAttribute('aria-current', 'true');
					buttons[i].scrollIntoView({ block: 'nearest' });
				}
			};
			const devSound = panel.querySelector('#devSound');
			devSound.addEventListener('click', async () => {
				await setSound(!soundOn);
				devSound.textContent = soundOn ? 'Sound on' : 'Sound off';
			});
			devTick();
			try {
				await new Promise((resolve, reject) => {
					const script = document.createElement('script');
					script.src = 'https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/GSDevTools.min.js';
					script.onload = resolve;
					script.onerror = reject;
					document.head.appendChild(script);
				});
				gsap.registerPlugin(GSDevTools);
				GSDevTools.create({ animation: tl, globalSync: false, persist: false, paused: true });
			} catch {
				panel.querySelector('p').textContent =
					'GSDevTools could not load; the beat list still works.';
			}
		}

		const record = location.hash === '#record';
		if (record) document.body.classList.add('record');
		window.reel = {
			tl,
			END,
			seek: (sec) => {
				tl.pause();
				tl.time(sec);
			},
			setSound,
			soundtrackReady,
		};
		renderAt(0);
		const dev = location.hash === '#dev';

		if (dev) {
			void startDevMode();
		}

		// Typing #dev onto an open page changes only the hash, which does not reload it, so watch for it.
		window.addEventListener('hashchange', () => {
			if (location.hash === '#dev') {
				void startDevMode();
			}
		});
		document.getElementById('devOpen').addEventListener('click', () => {
			history.replaceState(null, '', '#dev');
			void startDevMode();
		});
		const start = () => (record || dev ? null : tl.play());
		(document.fonts ? document.fonts.ready : Promise.resolve()).then(start);
	})();
</script>
