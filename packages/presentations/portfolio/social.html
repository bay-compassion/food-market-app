<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>The Bay Compassion · Project Preview</title>
		<style>
			:root {
				/* Current brand palette; update these when the brand guidelines change. */
				--social-background: #023940;
				--social-text: #fff;
				--social-accent: var(--social-text);
				--social-text-muted: rgb(255 255 255 / 80%);
			}
			* {
				box-sizing: border-box;
			}
			body {
				margin: 0;
				width: 1200px;
				height: 630px;
				padding: 70px;
				background: var(--social-background);
				color: var(--social-text);
				font-family: Arial, sans-serif;
				border-bottom: 18px solid var(--social-accent);
			}
			img {
				width: 240px;
				filter: brightness(0) invert(1);
			}
			p {
				color: var(--social-accent);
				font-size: 24px;
				margin: 50px 0 22px;
			}
			h1 {
				font-size: 68px;
				line-height: 1.05;
				letter-spacing: -3px;
				margin: 0;
				max-width: 980px;
			}
			footer {
				margin-top: 38px;
				font-size: 25px;
				color: var(--social-text-muted);
			}
		</style>
	</head>
	<body>
		<img src="../../../public/wordmark.png" alt="The Bay Compassion" />
		<p>Compassion Food · Community Markets</p>
		<h1>A Community Market<br />Rooted in Dignity and Choice</h1>
		<footer>Fresh Food · Personal Choice · Community Belonging</footer>
	</body>
</html>
