<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>The Bay Compassion · Project Preview</title>
		<link rel="stylesheet" href="../../../public/fonts/brand.css" />
		<link rel="stylesheet" href="../../../public/brand.css" />
		<link
			rel="stylesheet"
			href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&amp;display=swap"
		/>
		<style>
			:root {
				/* Current brand palette; update these when the brand guidelines change. */
				--social-background: #275c63;
				--social-text: #fff;
				--social-accent: var(--social-text);
				--social-text-muted: rgb(255 255 255 / 80%);
			}
			* {
				box-sizing: border-box;
			}
			body {
				margin: 0;
				width: 1200px;
				height: 630px;
				padding: 70px;
				background: var(--social-background);
				color: var(--social-text);
				font-family: var(--font-body);
				border-bottom: 18px solid var(--social-accent);
			}
			.brand-lockup {
				--brand-lockup-size: 28px;
			}
			p {
				color: var(--social-accent);
				font-size: 24px;
				margin: 30px 0 22px;
			}
			h1 {
				font-family: var(--font-heading);
				font-size: 68px;
				line-height: 1.05;
				letter-spacing: -3px;
				margin: 0;
				max-width: 980px;
			}
			footer {
				margin-top: 38px;
				font-size: 25px;
				color: var(--social-text-muted);
			}
		</style>
	</head>
	<body>
		<span class="brand-lockup wordmark" role="img" aria-label="The Bay Compassion"
			><img
				class="brand-lockup__icon"
				src="../../../public/bay-compassion-icon-digital.svg"
				alt=""
			/><span class="brand-lockup__name" aria-hidden="true"
				><span>The Bay</span><span>Compassion</span></span
			></span
		>
		<p>Compassion Food · Community Markets</p>
		<h1>A Community Market<br />Rooted in Dignity and Choice</h1>
		<footer>Fresh Food · Personal Choice · Community Belonging</footer>
	</body>
</html>
