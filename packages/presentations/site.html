<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>__TITLE__</title>
		<meta name="description" content="__SUMMARY__" />
		<meta property="og:type" content="website" />
		<meta property="og:title" content="__TITLE__ · The Bay Compassion" />
		<meta property="og:description" content="__DESCRIPTION__" />
		<meta property="og:url" content="__BASE__" />
		<meta property="og:image" content="__BASE__logo.png" />
		<link rel="canonical" href="__BASE__" />
		<meta name="twitter:card" content="summary_large_image" />
		<link rel="icon" href="logo.png" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link
			rel="stylesheet"
			href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap"
		/>
		<style>
			__FONT_CSS__
			/* The presentation plays directly from its GSAP page, with its own audio and controls. */
			:root {
				--brand: #275c63;
				--brand-dark: #1e474d;
				--night: #142f33;
				--ink: #ffffff;
				--ink-soft: rgb(255 255 255 / 72%);
				--accent: #7ebdc5;
				--focus: #ffb545;
				color-scheme: dark;
			}

			* {
				box-sizing: border-box;
			}

			body {
				margin: 0;
				min-height: 100vh;
				padding-inline: 16px;
				padding-block: 32px 48px;
				color: var(--ink);
				background:
					radial-gradient(circle at 75% 0%, rgb(39 92 99 / 80%), transparent 55%),
					linear-gradient(170deg, var(--brand-dark), var(--night));
				font-family: var(--font-body);
				line-height: 1.55;
			}

			main {
				container-type: inline-size;
				display: grid;
				gap: 24px;
				width: min(100%, 1100px);
				margin-inline: auto;
			}

			header {
				display: grid;
				gap: 14px;
			}

			.wordmark {
				--brand-lockup-size: 24px;
			}

			h1 {
				margin: 0;
				font-family: var(--font-heading);
				font-size: clamp(30px, 5vw, 52px);
				font-weight: 700;
				line-height: 1.05;
				text-wrap: balance;
			}

			.player {
				position: relative;
				aspect-ratio: 16 / 9;
				margin-bottom: 136px;
			}

			iframe {
				position: absolute;
				inset: 0;
				display: block;
				width: 100%;
				height: calc(100% + 136px);
				border: 0;
				border-radius: 14px;
				background: var(--night);
				box-shadow: 0 30px 80px rgb(0 0 0 / 45%);
			}

			.about {
				display: grid;
				gap: 12px;
				max-width: 65ch;
				font-size: 17px;
				color: var(--ink-soft);
			}

			.about p {
				margin: 0;
			}

			.links {
				display: flex;
				flex-wrap: wrap;
				gap: 12px;
			}

			.links a {
				display: inline-flex;
				align-items: center;
				min-height: 44px;
				padding: 0 20px;
				border: 2px solid rgb(255 255 255 / 35%);
				border-radius: 999px;
				color: var(--ink);
				font-family: var(--font-heading);
				font-size: 17px;
				font-weight: 700;
				letter-spacing: 0.04em;
				text-decoration: none;
				text-transform: uppercase;
			}

			.links a:first-child {
				border-color: var(--accent);
				color: var(--accent);
			}

			.links a:hover {
				border-color: var(--accent);
			}

			a:focus-visible {
				outline: 3px solid var(--focus);
				outline-offset: 3px;
			}
			/* Reserve room for wrapped chapter and playback controls with the brand typefaces. */
			@container (max-width: 999px) {
				.chaptered {
					margin-bottom: 232px;
				}
				.chaptered iframe {
					height: calc(100% + 232px);
				}
			}
			@container (max-width: 600px) {
				.guest-player {
					aspect-ratio: 9 / 16;
					margin-bottom: 238px;
				}
				.guest-player iframe {
					height: calc(100% + 238px);
				}
			}
		</style>
	</head>
	<body>
		<main>
			<header>
				<a href="__HOME__" style="color: inherit">← Project Overview</a>
				__BRAND_LOCKUP__
				<h1>__HEADING__</h1>
			</header>
			<div class="player __PLAYER_CLASS__">
				<iframe src="__INTERACTIVE__#watch" title="__TITLE__" allow="autoplay"></iframe>
			</div>
			<section class="about">
				<p>__SUMMARY__ __DESCRIPTION__</p>
				<p>
					The screens are simplified recreations of the real app, with fictional guests. __SOUND__
				</p>
			</section>
			<nav class="links" aria-label="__MORE__">
				<a href="__INTERACTIVE__#watch">__OPEN__</a>
				<a href="__INTERACTIVE__" download>__DOWNLOAD__</a>
				__OTHER_VIDEOS__
			</nav>
		</main>
	</body>
</html>
