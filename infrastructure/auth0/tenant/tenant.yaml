resourceServers:
  - name: Bay Compassion
    identifier: https://thebaycompassion.org
    allow_offline_access: false
    enforce_policies: true
    scopes:
      - value: run:queue
        description: >-
          Call guests, change visit status, add a guest by hand, close the day's
          session
      - value: manage:sessions
        description: >-
          Session settings, question bank, registration lifecycle, lottery,
          broadcast
      - value: read:reports
        description: The reports screen — aggregates, no names
      - value: export:guest-data
        description: The visit export, with names and phone numbers
      - value: manage:demo-data
        description: Add demo datasets
    signing_alg: RS256
    skip_consent_for_verifiable_first_party_clients: true
    subject_type_authorization:
      user:
        policy: require_client_grant
      client:
        policy: require_client_grant
    token_dialect: access_token_authz
    token_lifetime: 86400
    token_lifetime_for_web: 7200
clients:
  - name: Bay Compassion (Test Application)
    app_type: non_interactive
    cross_origin_authentication: false
    custom_login_page_on: true
    grant_types:
      - client_credentials
    is_first_party: true
    is_token_endpoint_ip_header_trusted: false
    jwt_configuration:
      alg: RS256
      lifetime_in_seconds: 36000
      secret_encoded: false
    oidc_conformant: true
    refresh_token:
      expiration_type: non-expiring
      leeway: 0
      infinite_token_lifetime: true
      infinite_idle_token_lifetime: true
      token_lifetime: 31557600
      idle_token_lifetime: 2592000
      rotation_type: non-rotating
    sso_disabled: false
    token_endpoint_auth_method: client_secret_post
  - name: The Bay Compassion
    allowed_clients: []
    allowed_logout_urls:
      - http://localhost:8888/
      - https://baycompassion.netlify.app/
      - https://app.thebaycompassion.org
    app_type: spa
    callbacks:
      - http://localhost:8888/
      - https://baycompassion.netlify.app/
      - https://app.thebaycompassion.org
    client_aliases: []
    cross_origin_authentication: false
    custom_login_page_on: true
    grant_types:
      - authorization_code
      - implicit
      - refresh_token
    is_first_party: true
    is_token_endpoint_ip_header_trusted: false
    jwt_configuration:
      alg: RS256
      lifetime_in_seconds: 36000
      secret_encoded: false
    logo_uri: https://baycompassion.netlify.app/bay-compassion-logo.png
    native_social_login:
      apple:
        enabled: false
      facebook:
        enabled: false
    oidc_conformant: true
    refresh_token:
      expiration_type: expiring
      leeway: 0
      token_lifetime: 2592000
      idle_token_lifetime: 1296000
      infinite_token_lifetime: false
      infinite_idle_token_lifetime: false
      rotation_type: rotating
    skip_non_verifiable_callback_uri_confirmation_prompt: true
    sso: true
    sso_disabled: false
    token_endpoint_auth_method: none
    web_origins:
      - http://localhost:8888/
      - https://baycompassion.netlify.app/
      - https://app.thebaycompassion.org
databases:
  - name: Username-Password-Authentication
    strategy: auth0
    authentication:
      active: true
    connected_accounts:
      active: false
    enabled_clients:
      - Bay Compassion (Test Application)
      - The Bay Compassion
    is_domain_connection: true
    options:
      mfa:
        active: true
        return_enroll_settings: true
      passwordPolicy: good
      passkey_options:
        challenge_ui: both
        local_enrollment_enabled: true
        progressive_enrollment_enabled: true
      strategy_version: 2
      authentication_methods:
        passkey:
          enabled: false
        password:
          enabled: true
          api_behavior: required
          signup_behavior: allow
      brute_force_protection: true
      disable_self_service_change_password: false
    realms:
      - Username-Password-Authentication
connections:
  - name: google-oauth2
    strategy: google-oauth2
    authentication:
      active: true
    connected_accounts:
      active: false
    enabled_clients:
      - Bay Compassion (Test Application)
      - The Bay Compassion
    is_domain_connection: false
    options:
      email: true
      scope:
        - email
        - profile
      profile: true
tenant:
  client_id_metadata_document_supported: false
  default_audience: https://thebaycompassion.org
  default_directory: ''
  enabled_locales:
    - en
  flags:
    revoke_refresh_token_grant: false
    disable_clickjack_protection_headers: false
  friendly_name: The Bay Compassion
  oidc_logout:
    rp_logout_end_session_endpoint_discovery: true
  picture_url: ''
  resource_parameter_profile: compatibility
  sandbox_version: '22'
  support_email: contact@thebaycompassion.org
  support_url: ''
clientGrants:
  - client_id: Bay Compassion (Test Application)
    audience: https://thebaycompassion.org
    scope: []
    subject_type: client
  - client_id: The Bay Compassion
    audience: https://thebaycompassion.org
    allow_all_scopes: false
    scope: []
    subject_type: user
roles:
  - name: admin
    description: Admin for Bay Compassion
    permissions:
      - permission_name: export:guest-data
        resource_server_identifier: https://thebaycompassion.org
      - permission_name: manage:sessions
        resource_server_identifier: https://thebaycompassion.org
      - permission_name: read:reports
        resource_server_identifier: https://thebaycompassion.org
      - permission_name: run:queue
        resource_server_identifier: https://thebaycompassion.org
    type: tenant
  - name: developer
    description: Developer role with superuser like permissions
    permissions:
      - permission_name: manage:demo-data
        resource_server_identifier: https://thebaycompassion.org
    type: tenant
  - name: worker
    description: Role for non-admin staff users
    permissions:
      - permission_name: run:queue
        resource_server_identifier: https://thebaycompassion.org
    type: tenant
