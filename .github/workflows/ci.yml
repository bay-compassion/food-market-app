name: CI

on:
  push:
    branches: [main]
  # No `branches` filter: that filter matches a pull request's *base* branch, so it skipped every
  # PR in a stack except the one based on main. Stacked PRs need checks too — they are reviewed
  # and merged individually, and a broken middle layer would otherwise reach main unchecked.
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Check diagrams
        run: npm run check:diagrams

      - name: Test
        run: npm run test:unit

  queue-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Test the full queue lifecycle
        run: npm run test:e2e:queue
      - name: Upload queue diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: queue-e2e
          path: |
            test-results/queue/
            test-results/queue-server.log
            playwright-report/queue/
          retention-days: 7
