name: CI

on:
  push:
    branches: [main]
  # No `branches` filter: that filter matches a pull request's *base* branch, so it skipped every
  # PR in a stack except the one based on main. Stacked PRs need checks too — they are reviewed
  # and merged individually, and a broken middle layer would otherwise reach main unchecked.
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Check formatting
        run: pnpm run format:check

      - name: Check diagrams
        run: pnpm run check:diagrams

      - name: Test
        run: pnpm run test:unit

  # Every browser test except the `@large` ones, against the Vite dev server with API responses
  # stubbed by each spec. The queue rig (`@large`) runs from `e2e-large.yml` on demand instead.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - uses: ./.github/actions/install-chromium

      - name: Test small and medium browser specs
        run: pnpm run test:e2e --grep-invert @large
        env:
          # The app will not start without a client ID. Any value will do: specs that depend on a
          # flag pin it by intercepting LaunchDarkly's requests, and the rest read flag defaults.
          VITE_LAUNCHDARKLY_CLIENT_ID: e2e-placeholder

      - name: Capture portfolio assets
        run: pnpm run capture:portfolio

      - name: Upload portfolio images
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-images
          path: docs/images/portfolio
          retention-days: 7

      - name: Upload browser test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e
          path: |
            test-results/browser/
            playwright-report/browser/
          retention-days: 7

  # Every story rendered in headless Chromium, with its `play` function run: the same run as
  # `pnpm run test:storybook` and Storybook's testing panel.
  storybook:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - uses: ./.github/actions/install-chromium

      - name: Test stories
        # Two shards, each in a fresh browser and Vitest server. On CI runners, one session stops
        # connecting new story iframes after about 56 of them: the next tester reports "Cannot
        # connect to the server in 60 seconds", which surfaces as "Cannot connect to the iframe"
        # when files run in parallel. Add a shard if the story count approaches that again.
        run: |
          pnpm run test:storybook --shard=1/2
          pnpm run test:storybook --shard=2/2
