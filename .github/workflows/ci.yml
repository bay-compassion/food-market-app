name: CI

on:
  push:
    branches: [main]
  # No `branches` filter: that filter matches a pull request's *base* branch, so it skipped every
  # PR in a stack except the one based on main. Stacked PRs need checks too — they are reviewed
  # and merged individually, and a broken middle layer would otherwise reach main unchecked.
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Check diagrams
        run: npm run check:diagrams

      - name: Test
        run: npm run test:unit

  # Every browser test except the `@large` ones, against the Vite dev server with API responses
  # stubbed by each spec. The queue rig (`@large`) runs from `e2e-large.yml` on demand instead.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Read Playwright version
        id: playwright
        run: echo "version=$(npx playwright --version | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"

      # Chromium is the slow part of the setup; it only changes when Playwright does.
      - name: Cache Playwright browsers
        id: browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Chromium
        if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Chromium system dependencies
        if: steps.browsers.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Test small and medium browser specs
        run: npm run test:e2e -- --grep-invert @large
        env:
          # The app will not start without a client ID. Any value will do: specs that depend on a
          # flag pin it by intercepting LaunchDarkly's requests, and the rest read flag defaults.
          VITE_LAUNCHDARKLY_CLIENT_ID: e2e-placeholder

      - name: Upload browser test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e
          path: |
            test-results/browser/
            playwright-report/browser/
          retention-days: 7
