name: Release desktop app

# Builds Compassion Food Market (packages/check-in-app), signs it with the release certificate, and
# drafts a GitHub release holding its zip and latest-mac.yml. Publishing the draft is a person's
# call: installed copies update from the latest published release, so publishing is the release.
# See packages/check-in-app/README.md, "Releasing".
#
# Pushing a `check-in-app-v<version>` tag drafts that release. Running it by hand builds and signs
# the app without releasing anything, and keeps the result as a workflow artifact.

on:
  push:
    tags: ['check-in-app-v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-desktop-app
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Read the app's version
        id: version
        run: echo "version=$(node -p "require('./packages/check-in-app/package.json').version")" >> "$GITHUB_OUTPUT"

      # The app compares versions, not tags: a tag ahead of package.json would publish a release
      # every installed copy thinks it already has.
      - name: Check the tag names that version
        if: github.ref_type == 'tag'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ "$GITHUB_REF_NAME" != "check-in-app-v$VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match packages/check-in-app/package.json ($VERSION). Tag check-in-app-v$VERSION, or bump the version first."
            exit 1
          fi

      # A keychain of its own for the run, so the certificate never touches the runner's login
      # keychain. The certificate is self-signed, so macOS doesn't trust it; codesign signs with it
      # regardless, and an update only has to match the certificate the installed copy has.
      - name: Import the signing certificate
        env:
          APP_SIGNING_CERTIFICATE: ${{ secrets.APP_SIGNING_CERTIFICATE }}
          APP_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.APP_SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$APP_SIGNING_CERTIFICATE" ] || [ -z "$APP_SIGNING_CERTIFICATE_PASSWORD" ]; then
            echo "::error::The APP_SIGNING_CERTIFICATE and APP_SIGNING_CERTIFICATE_PASSWORD secrets are missing. See packages/check-in-app/README.md, \"Signing\"."
            exit 1
          fi

          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(openssl rand -base64 24)"
          certificate="$RUNNER_TEMP/certificate.p12"

          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          printf '%s' "$APP_SIGNING_CERTIFICATE" | base64 --decode > "$certificate"
          security import "$certificate" -k "$keychain" -P "$APP_SIGNING_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" > /dev/null
          rm "$certificate"

          echo "SIGNING_KEYCHAIN=$keychain" >> "$GITHUB_ENV"

      - name: Build and sign
        run: pnpm --filter @bay-compassion/check-in-app build
        env:
          SIGNING_IDENTITY: Compassion Food Market Releases
          REQUIRE_SIGNING: '1'

      - name: Keep the build
        uses: actions/upload-artifact@v4
        with:
          name: compassion-food-market-${{ steps.version.outputs.version }}
          path: |
            packages/check-in-app/release/*.zip
            packages/check-in-app/release/latest-mac.yml
          retention-days: 14

      # A draft is invisible to installed copies. Not marked latest either: publishing it from the
      # Releases page makes it the latest release, which is what the app looks for.
      - name: Draft the release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            packages/check-in-app/release/*.zip \
            packages/check-in-app/release/latest-mac.yml \
            --draft \
            --title "Compassion Food Market $VERSION" \
            --notes "The check-in iMac's app, version $VERSION. Installed copies update to it once this release is published as the latest."

      - name: Remove the keychain
        if: always()
        run: |
          if [ -n "${SIGNING_KEYCHAIN:-}" ]; then
            security delete-keychain "$SIGNING_KEYCHAIN" || true
          fi
