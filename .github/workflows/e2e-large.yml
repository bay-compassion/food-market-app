name: Large E2E

# The `@large` browser tests: the full-stack queue rig, with Netlify Functions and an isolated
# database. Slow enough that it runs only when started by hand (Actions → Large E2E → Run workflow),
# e.g. before merging a change to the queue, rather than on every pull request.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  queue:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Test the full queue lifecycle
        run: pnpm run test:e2e:queue --grep @large

      - name: Upload queue diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: queue-e2e
          path: |
            test-results/queue/
            test-results/queue-server.log
            playwright-report/queue/
          retention-days: 7
