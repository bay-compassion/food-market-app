name: Deploy staging

run-name: Deploy ${{ inputs.ref }} to staging requested by @${{ github.actor }}

# Staging is the separate `baycompassion-staging` Netlify project, whose production branch is
# `staging` (see docs/staging.md). This moves that branch to any ref — a feature branch, a PR head,
# or main to reset it — and Netlify builds whatever the branch points at. Nothing else ever pushes to `staging`, so overwriting it is safe.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or commit to deploy to staging
        required: true
        default: main

permissions:
  contents: write

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    name: Move the staging branch
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Force-push to staging
        env:
          REF: ${{ inputs.ref }}
        run: |
          sha="$(git rev-parse HEAD)"
          git push --force origin "HEAD:refs/heads/staging"
          {
            echo "### Staging now points at \`${sha:0:7}\` ($REF)"
            echo "[Follow the build in Netlify](https://app.netlify.com/projects/baycompassion-staging/deploys)"
            echo "· [Open staging](https://baycompassion-staging.netlify.app/)"
          } >> "$GITHUB_STEP_SUMMARY"
