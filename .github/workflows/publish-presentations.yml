name: Publish project site

on:
  push:
    branches: [main]
    paths:
      - 'packages/presentations/**'
      - 'scripts/screenshots/**'
      - '.storybook/**'
      - 'docs/images/portfolio/**'
      - 'src/locales.ts'
      - 'src/adminLocales.ts'
      # The guest guide's phone runs the guest app itself, so a change to it changes the guide.
      - 'src/components/**'
      - 'src/stores/**'
      - 'src/models/**'
      - 'src/services/**'
      - 'src/styles/**'
      - 'src/theme.ts'
      - 'public/bay-compassion-logo.png'
      - 'public/wordmark.png'
      - 'public/bay-compassion-*.svg'
      - 'public/fonts/**'
      - 'public/brand.css'
      - 'public/brand-lockup*.png'
      - 'package.json'
      - 'package-lock.json'
      - '.nvmrc'
      - '.github/workflows/publish-presentations.yml'
  workflow_dispatch:

permissions:
  contents: read

# Publish complete sites in order, letting an in-progress deployment finish.
concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - uses: ./.github/actions/install-chromium

      - name: Refresh portfolio assets
        run: npm run capture:portfolio

      # The GSAP pages embed the committed soundtrack, and the guest guide its phone, which
      # Vite builds. Screenshots use Chromium; no speech model, GarageBand library, frame
      # capture or video encoder is needed on the runner.
      - name: Build project site
        run: node packages/presentations/publish.ts
        env:
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}

      - name: Verify project site
        run: node packages/presentations/verify.ts --site-only

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: packages/presentations/out/site

  deploy:
    # A manual run on another branch builds an artifact for review; only main goes live.
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy project site
        id: deployment
        uses: actions/deploy-pages@v4
